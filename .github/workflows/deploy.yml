name: Deploy to VM

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-myunand-kurikulum-production
  cancel-in-progress: false

jobs:
  deploy:
    # Add the custom `myunand` label to vm-myunand in GitHub runner settings.
    runs-on: [self-hosted, linux, x64, myunand]
    timeout-minutes: 30

    steps:
      - name: Deploy and verify on production VM
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_DIR="/home/docker/my-unand-akademik"
          # Keep the original Compose project so this deploy updates the existing
          # stack and releases its ports instead of creating a parallel stack.
          COMPOSE_PROJECT="my-unand-akademik"
          COMPOSE=(docker compose --project-name "$COMPOSE_PROJECT" --file "$PROJECT_DIR/docker-compose.yml")

          echo "===== DEPLOY START ====="
          date --iso-8601=seconds
          echo "Runner: ${RUNNER_NAME:-unknown} (${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown})"
          echo "Host: $(hostname -f)"
          echo "Docker contexts:"
          docker context ls
          docker info --format 'Docker daemon: {{.Name}}'

          if [[ "$(hostname -s)" != "docker-prod" ]]; then
            echo "ERROR: deployment ran on unexpected host $(hostname -s); expected docker-prod" >&2
            exit 1
          fi

          cd "$PROJECT_DIR"
          git fetch --prune origin main
          git checkout -f -B main origin/main
          git reset --hard origin/main
          echo "Deploying commit: $(git rev-parse --short HEAD)"
          if [[ ! -s "$PROJECT_DIR/tpb.sql" ]]; then
            echo "ERROR: $PROJECT_DIR/tpb.sql is missing or empty; TPB seeder requires this dump" >&2
            exit 1
          fi

          "${COMPOSE[@]}" config --quiet
          # Build every service before starting the stack with --no-build.
          "${COMPOSE[@]}" build

          echo "===== DATABASE MIGRATIONS ====="
          "${COMPOSE[@]}" run --rm --no-deps backend npm run db:migrate

          # npm run db:seed invokes sequelize-cli db:seed:all and re-runs
          # every registered seeder on every deployment.
          echo "===== DATABASE SEEDERS ====="
          "${COMPOSE[@]}" run --rm --no-deps \
            --volume "$PROJECT_DIR/tpb.sql:/tpb.sql:ro" \
            backend npm run db:seed

          echo "===== STARTING SERVICES ====="
          "${COMPOSE[@]}" up --detach --no-build --remove-orphans

          # Wait for the HTTP services to be healthy and the worker to run.
          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            backend_id=$("${COMPOSE[@]}" ps --all --quiet backend)
            frontend_id=$("${COMPOSE[@]}" ps --all --quiet frontend)
            worker_id=$("${COMPOSE[@]}" ps --all --quiet penjadwalan-worker)

            if [[ -n "$backend_id" && -n "$frontend_id" && -n "$worker_id" ]]; then
              backend_state=$(docker inspect --format '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$backend_id")
              frontend_state=$(docker inspect --format '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$frontend_id")
              worker_state=$(docker inspect --format '{{.State.Status}}' "$worker_id")
              echo "backend=$backend_state frontend=$frontend_state worker=$worker_state"

              if [[ "$backend_state" == "running/healthy" && "$frontend_state" == "running/healthy" && "$worker_state" == "running" ]]; then
                "${COMPOSE[@]}" ps
                echo "===== DEPLOY SUCCESS ====="
                exit 0
              fi

              if [[ "$backend_state" == exited/* || "$backend_state" == dead/* || "$frontend_state" == exited/* || "$frontend_state" == dead/* || "$worker_state" == "exited" || "$worker_state" == "dead" ]]; then
                break
              fi
            fi
            sleep 5
          done

          echo "ERROR: HTTP services are unhealthy or scheduling worker is not running" >&2
          "${COMPOSE[@]}" ps --all >&2 || true
          "${COMPOSE[@]}" logs --no-color --tail=100 >&2 || true
          exit 1
